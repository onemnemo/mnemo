<!doctype html>
<html lang="en" data-theme="dawn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mnemo-web</title>
    <script>
      // Apply the persisted theme before the bundle paints, to avoid a flash of
      // the default theme. Kept in lockstep with src/stores/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem("mnemo.theme");
          if (t === "dawn" || t === "dusk" || t === "ember" || t === "noon") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
