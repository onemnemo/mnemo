<!doctype html>
<html lang="en" data-theme="dawn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mnemo-web</title>
    <script>
      // First-paint hint only: apply the last-known theme before React hydrates
      // settings from the backend, to avoid a flash of the default theme. The
      // backend (Appearance.Theme) is the source of truth; this cache is written
      // by src/stores/theme.ts and kept in lockstep with it.
      (function () {
        try {
          var t = localStorage.getItem("mnemo.theme");
          if (t === "dawn" || t === "dusk" || t === "ember" || t === "noon") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
