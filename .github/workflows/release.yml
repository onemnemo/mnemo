# Builds and publishes a release from a tag.
#
# The tag decides everything: v0.8.0 is a stable release, v0.8.0-beta.1 and v0.8.0-rc.1
# are beta, v0.8.0-alpha.1 and v0.8.0-nightly.* are nightly. Nothing is packed until the
# tests pass, so a tag on a broken commit fails here rather than on someone's machine.
#
# The release itself is the update feed: Velopack publishes releases.{channel}.json
# alongside the packages, and the app reads it from there. The feed is also kept as a
# workflow artifact so a bad publish can be inspected without downloading a release.
name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Read once, here, so the build and the two publish jobs cannot disagree about what
  # this tag means.
  meta:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.tag.outputs.semver }}
      prefix: ${{ steps.tag.outputs.prefix }}
      channel: ${{ steps.tag.outputs.channel }}
      channels: ${{ steps.tag.outputs.channels }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # Tags are v1.2.3; NuGet / MSBuild Version must be semver without the leading v.
      # AssemblyVersion and FileVersion cannot carry a prerelease suffix, so the numeric
      # part is resolved separately and passed as VersionPrefix.
      #
      # The channel mapping mirrors UpdateChannels.ForVersion: a version says how mature
      # a build is, a channel says how close to development the user chose to sit, and
      # more than one version state can share a track. A finished release publishes to
      # Beta as well as Stable, otherwise Beta users sit on the last prerelease of a
      # version that has already shipped.
      - name: Resolve the version and channel from the tag
        id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SEMVER="${TAG#v}"
          PREFIX="${SEMVER%%-*}"
          PREFIX="${PREFIX%%+*}"

          SUFFIX="${SEMVER#"$PREFIX"}"
          LABEL="${SUFFIX#-}"
          LABEL="${LABEL%%.*}"
          LABEL="${LABEL%%+*}"
          LABEL="$(printf '%s' "$LABEL" | tr '[:upper:]' '[:lower:]')"

          case "$LABEL" in
            "")                      CHANNEL=stable;  CHANNELS="stable beta"; PRERELEASE=false ;;
            nightly*|alpha*|dev*)    CHANNEL=nightly; CHANNELS="nightly";     PRERELEASE=true  ;;
            *)                       CHANNEL=beta;    CHANNELS="beta";        PRERELEASE=true  ;;
          esac

          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "channels=$CHANNELS" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "$TAG is a $CHANNEL release, published to: $CHANNELS"

  build:
    needs: meta
    # One leg per shipped platform, each packing on its own runner: vpk builds for the OS it
    # is running on, so there is no cross-target flag to lean on here.
    #
    # macOS and Linux are new and neither has been through a real install yet, which is what
    # the nightly channel is for. Do not put either in front of people on a stable tag until
    # a nightly of the same commit has been installed and launched on that platform.
    #
    # fail-fast stays off so an untested platform breaking cannot take the Windows packages,
    # which are the ones people actually have, down with it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            mainexe: Mnemo.Host.exe
            packIcon: mnemo-web/public/app-icons/AppIconDawn.ico
          - rid: osx-arm64
            os: macos-latest
            mainexe: Mnemo.Host
            # Written by "Build the macOS icon" below, because vpk wants an icns and the
            # repo has no way to produce one on a Windows machine.
            packIcon: build/Mnemo.icns
          - rid: linux-x64
            os: ubuntu-latest
            mainexe: Mnemo.Host
            packIcon: mnemo-web/public/app-icons/AppIconDawn.png
    runs-on: ${{ matrix.os }}
    env:
      PACK_ID: Mnemo.Desktop.V2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          # Exact, not a major, and it has to stay in step with the node development runs
          # on. npm writes the lockfile's optional platform packages differently from one
          # version to the next, and npm ci rejects a lockfile another npm wrote, so the
          # release can only install what the machine that generated the lockfile produced.
          # A floating major silently picks up a different npm and fails the build in four
          # seconds with a package that looks missing but is not.
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: mnemo-web/package-lock.json

      - name: Restore vpk tool
        run: dotnet tool restore

      - name: Install web dependencies
        working-directory: mnemo-web
        run: npm ci

      # Restore before tests and publish: the project only copies an existing binary, and PDF
      # tests skip without it.
      - name: Restore the Typst binary
        shell: pwsh
        run: ./scripts/restore-typst.ps1 -Rid ${{ matrix.rid }}

      # Each platform must pass its tests before packing. Publishing also requires a Windows
      # package.
      - name: Lint the web UI
        working-directory: mnemo-web
        run: npm run lint

      - name: Typecheck the web UI
        working-directory: mnemo-web
        run: npx tsc -b

      - name: Test the web UI
        working-directory: mnemo-web
        run: npm test

      - name: Test the solution
        run: dotnet test MnemoApp.sln -c Release

      # The published host serves this from wwwroot, so it has to exist before the publish
      # that copies it in. No dist means an app that starts and shows nothing.
      - name: Build the web UI
        working-directory: mnemo-web
        run: npm run build

      # The notes are the CHANGELOG section named for this tag, and Velopack shows them in
      # the update prompt, so an empty notes file is a version that tells the person nothing
      # about what they are about to install. A prerelease usually has no curated section,
      # hence the fallback rather than a failure.
      - name: Collect the release notes
        shell: bash
        env:
          SEMVER: ${{ needs.meta.outputs.semver }}
        run: |
          set -euo pipefail
          mkdir -p build
          notes=build/release-notes.md
          awk -v heading="## $SEMVER" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            printf 'Mnemo %s\n' "$SEMVER" > "$notes"
          fi
          cat "$notes"

      # vpk wants an icns on macOS, and nothing in the repo can produce one from Windows,
      # so it is built here from the same source art the app itself uses. sips and iconutil
      # are both part of macOS, so this needs nothing installed.
      #
      # The set stops at 256 rather than carrying the 512 and 1024 entries a complete one
      # would: the source is 256px, and inventing the larger sizes by upscaling would only
      # make Finder's largest icon view look soft in a more elaborate way.
      - name: Build the macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          src=mnemo-web/public/app-icons/AppIconDawn.png
          iconset=build/Mnemo.iconset
          mkdir -p "$iconset"
          # Each entry is the name iconutil expects, then the pixel size to render it at.
          for entry in icon_16x16=16 icon_16x16@2x=32 icon_32x32=32 icon_32x32@2x=64 \
                       icon_128x128=128 icon_128x128@2x=256 icon_256x256=256; do
            sips -z "${entry#*=}" "${entry#*=}" "$src" --out "$iconset/${entry%=*}.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o build/Mnemo.icns
          ls -l build/Mnemo.icns

      - name: Publish
        run: >
          dotnet publish Mnemo.Host/Mnemo.Host.csproj -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ needs.meta.outputs.semver }}
          -p:VersionPrefix=${{ needs.meta.outputs.prefix }}
          -o publish

      # A publish that quietly shipped no UI is worse than a failed build, and the csproj
      # only warns so that ordinary builds and tests never need a web build.
      - name: Verify the SPA was published
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/wwwroot/index.html")) {
            throw "publish/wwwroot/index.html is missing; the SPA did not reach the published output."
          }

      # Pack writes an index listing everything it finds beside it, and the upload refuses
      # to merge an index with one already published, so whatever is in this directory at
      # pack time is the entire published history from here on. Pulling the current
      # packages down first is what stops a release from unpublishing every earlier one.
      # It also gives pack something to build delta packages against.
      #
      # The channel carries the RID because every platform's packages share one release
      # and the channel is the only thing in an index asset's name. This has to match
      # UpdateChannels.FeedName exactly or the app looks for an index nothing writes.
      - name: Fetch the published packages
        shell: bash
        env:
          CHANNELS: ${{ needs.meta.outputs.channels }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p vpk-out
          for ch in $CHANNELS; do
            feed="releases.${{ matrix.rid }}-$ch.json"
            pre=""
            [ "$ch" = stable ] || pre="--pre"
            dotnet vpk download github --repoUrl "$REPO_URL" --channel "${{ matrix.rid }}-$ch" -o vpk-out --token "$GH_TOKEN" $pre

            # download exits 0 whether the channel is empty or unreadable, and the two
            # cases are a republished history apart. If any recent release carries this
            # channel's index, the download had to bring something back.
            published="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "${{ github.api_url }}/repos/${{ github.repository }}/releases?per_page=10" \
              | jq --arg f "$feed" '[.[] | select(.assets[]?.name == $f)] | length')"
            if [ "$published" -gt 0 ] && ! ls vpk-out/*-"${{ matrix.rid }}-$ch"-*.nupkg >/dev/null 2>&1; then
              echo "::error::$feed is published but nothing came back for ${{ matrix.rid }}-$ch"
              exit 1
            fi
          done

      # One pack per channel, all into the same directory: Velopack puts the channel in
      # every file name it writes, so the tracks sit side by side without colliding.
      #
      # macOS signing is not configured yet. vpk pack accepts --signAppIdentity,
      # --entitlements, --keychain and --notaryProfile on that platform (this Velopack
      # version has codesign and notarytool support built in); that is where they would
      # slot into the invocation below, gated on runner.os == 'macOS'. No certificate,
      # keychain profile or secret is wired up here. Until one is, the macOS build
      # stays unsigned, and Gatekeeper refuses to open it on a clean machine by default;
      # see the macOS section of README.md for the right-click-Open workaround.
      - name: Pack (Velopack)
        shell: bash
        env:
          CHANNELS: ${{ needs.meta.outputs.channels }}
          SEMVER: ${{ needs.meta.outputs.semver }}
        run: |
          set -euo pipefail
          for ch in $CHANNELS; do
            dotnet vpk pack \
              --packId "$PACK_ID" \
              --packTitle Mnemo \
              --packAuthors Mnemo \
              --packVersion "$SEMVER" \
              --runtime ${{ matrix.rid }} \
              --packDir publish \
              --mainExe ${{ matrix.mainexe }} \
              --icon ${{ matrix.packIcon }} \
              --releaseNotes build/release-notes.md \
              -o vpk-out \
              --channel "${{ matrix.rid }}-$ch"
          done

      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "publish/*" -DestinationPath "vpk-out/Mnemo-Portable-${{ matrix.rid }}.zip" -Force

      # tar rather than zip, because the executable bit is the only thing that makes an
      # unpacked copy runnable and a zip does not carry one.
      - name: Portable tarball (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "vpk-out/Mnemo-Portable-${{ matrix.rid }}.tar.gz" -C publish .

      # Fail here if packaging produced no installer matching the publish patterns.
      - name: List the packed artifacts
        shell: bash
        run: ls -l vpk-out

      - uses: actions/upload-artifact@v4
        with:
          name: vpk-${{ matrix.rid }}
          path: vpk-out/**

  # This is the publish. Everything the app needs to find and install an update lands
  # here: the packages, and the releases.{rid}-{channel}.json index that lists them.
  publish-update-feed:
    needs: [meta, build]
    # A matrix job reports failure if any leg failed, so waiting on `build` normally would
    # let one platform withhold the packages every other platform built. That is the exact
    # outcome fail-fast is turned off to avoid, and the artifact scan below already refuses
    # to publish nothing, so the empty case is covered without the whole job standing down.
    if: ${{ !cancelled() && needs.meta.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      PACK_ID: Mnemo.Desktop.V2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore vpk tool
        run: dotnet tool restore

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vpk-*
          merge-multiple: false

      # Require Windows before any upload, so Windows users are never offered a release without a
      # compatible download.
      - name: Require the Windows packages
        shell: bash
        run: |
          set -euo pipefail
          if ! ls artifacts/vpk-win-x64/*.nupkg >/dev/null 2>&1; then
            echo "::error::the win-x64 leg packed nothing, so this tag cannot be released"
            exit 1
          fi

      # One upload per RID and channel, in sequence. The first creates the release and
      # the rest attach to it, which is what --merge permits; running them in parallel
      # would have several of them racing to create the same tag.
      - name: Upload the packages and the feed
        shell: bash
        env:
          CHANNELS: ${{ needs.meta.outputs.channels }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # An if rather than "test && assign": under set -e a false test would end the
          # whole list nonzero and take the step down with it on every stable release.
          pre=""
          if [ "$PRERELEASE" = true ]; then
            pre="--pre"
          fi

          # Whichever legs actually produced packages, rather than a second list of RIDs to
          # keep in step with the build matrix. The build runs with fail-fast off precisely
          # so a new platform breaking does not withhold the ones that worked, and hardcoding
          # the RIDs here would undo that by failing the publish on the missing directory.
          shopt -s nullglob
          dirs=(artifacts/vpk-*)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::no build artifacts arrived, so there is nothing to publish"
            exit 1
          fi

          for src in "${dirs[@]}"; do
            rid="$(basename "$src")"
            rid="${rid#vpk-}"
            echo "publishing $rid"
            for ch in $CHANNELS; do
              dotnet vpk upload github \
                -o "$src" \
                --channel "$rid-$ch" \
                --repoUrl "$REPO_URL" \
                --token "$GH_TOKEN" \
                --tag "${{ github.ref_name }}" \
                --releaseName "${{ github.ref_name }}" \
                --targetCommitish "${{ github.sha }}" \
                --merge \
                --publish $pre
            done
          done

      # Velopack bakes the channel into the installer it builds, so the beta-named
      # Setup.exe a stable release also produces would put whoever ran it on the beta
      # track without saying so. The upload has to carry it, because it is in that
      # channel's asset manifest, so it comes off the release page here instead.
      #
      # Velopack's own portable zip goes too. It is the same content as the one this
      # workflow builds, under a name that says a channel a portable build does not
      # follow, and two portable downloads is one too many.
      - name: Take the wrong-channel downloads off the release page
        shell: bash
        env:
          CHANNEL: ${{ needs.meta.outputs.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="${{ github.api_url }}/repos/${{ github.repository }}"

          # Read off the packages that were built rather than spelled out, because the
          # installer's extension is the platform's own: Setup.exe on Windows, and on Linux
          # an AppImage, which carries no installer word in its name at all. Both forms are
          # matched, so the keep list holds this channel's installer on every platform.
          shopt -s nullglob
          keep=""
          for installer in artifacts/vpk-*/*-"$CHANNEL"-Setup.* artifacts/vpk-*/*-"$CHANNEL".AppImage; do
            keep="$keep $(basename "$installer")"
          done
          echo "keeping:$keep"

          curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/${{ github.ref_name }}" \
            | jq -r --arg keep "$keep" '
                ($keep | split(" ") | map(select(length > 0))) as $keep
                | .assets[]
                | select((.name | test("-Setup\\.")) or (.name | test("-Portable\\.")) or (.name | test("\\.AppImage$")))
                | select(.name as $n | ($keep | index($n)) | not)
                | "\(.id) \(.name)"' \
            | while read -r id name; do
                echo "removing $name"
                curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/releases/assets/$id"
              done

  # After the feed, so the release already exists and this only adds to it. The installer
  # named here is the tag's own channel, spelled out rather than globbed, so this cannot
  # put back a download the step above just removed.
  upload-to-release:
    needs: [meta, publish-update-feed]
    if: ${{ !cancelled() && needs['publish-update-feed'].result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vpk-*
          merge-multiple: false

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          # The curated notes are what the in-app update prompt shows; the release page also
          # gets the commit list appended, which is the part worth reading on a nightly.
          generate_release_notes: true
          # Linux has no -Setup file: vpk's installer there is the AppImage, named
          # {packId}-{rid}-{channel}.AppImage with no installer word in it at all. Matching
          # only -Setup would leave the one download a Linux user needs off the page.
          files: |
            artifacts/**/Mnemo-Portable-*.zip
            artifacts/**/Mnemo-Portable-*.tar.gz
            artifacts/**/*-${{ needs.meta.outputs.channel }}-Setup.*
            artifacts/**/*-${{ needs.meta.outputs.channel }}.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hash the final published installer and portable assets so the list reflects the platforms
      # that succeeded.
      - name: Publish checksums for the downloads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          gh release download "$TAG" --repo "$REPO" --dir downloads --clobber \
            --pattern '*-Setup.*' \
            --pattern '*.AppImage' \
            --pattern 'Mnemo-Portable-*'
          # Write outside the directory to exclude the checksum file itself; use bare names for
          # sha256sum -c.
          ( cd downloads && sha256sum -- * ) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO" --clobber

  upload-update-feed-artifact:
    needs: [meta, build]
    if: ${{ !cancelled() && needs.meta.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vpk-*
          merge-multiple: false

      - name: Upload update feed files
        uses: actions/upload-artifact@v4
        with:
          name: update-feed-${{ needs.meta.outputs.channel }}-${{ github.ref_name }}
          path: |
            artifacts/**/*.nupkg
            artifacts/**/RELEASES-*
            artifacts/**/releases.*.json
            artifacts/**/assets.*.json
          if-no-files-found: error
