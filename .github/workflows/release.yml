# Builds and publishes a release from a tag.
#
# The tag decides everything: v0.8.0 is a stable release, v0.8.0-beta.1 and v0.8.0-rc.1
# are beta, v0.8.0-alpha.1 and v0.8.0-nightly.* are nightly. Nothing is packed until the
# tests pass, so a tag on a broken commit fails here rather than on someone's machine.
#
# GitHub Release assets stay user-facing (installer and portable binaries). The update
# feed goes to Pages, and to a separate workflow artifact.
name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Read once, here, so the build and the two publish jobs cannot disagree about what
  # this tag means.
  meta:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.tag.outputs.semver }}
      prefix: ${{ steps.tag.outputs.prefix }}
      channel: ${{ steps.tag.outputs.channel }}
      channels: ${{ steps.tag.outputs.channels }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # Tags are v1.2.3; NuGet / MSBuild Version must be semver without the leading v.
      # AssemblyVersion and FileVersion cannot carry a prerelease suffix, so the numeric
      # part is resolved separately and passed as VersionPrefix.
      #
      # The channel mapping mirrors UpdateChannels.ForVersion: a version says how mature
      # a build is, a channel says how close to development the user chose to sit, and
      # more than one version state can share a track. A finished release publishes to
      # Beta as well as Stable, otherwise Beta users sit on the last prerelease of a
      # version that has already shipped.
      - name: Resolve the version and channel from the tag
        id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SEMVER="${TAG#v}"
          PREFIX="${SEMVER%%-*}"
          PREFIX="${PREFIX%%+*}"

          SUFFIX="${SEMVER#"$PREFIX"}"
          LABEL="${SUFFIX#-}"
          LABEL="${LABEL%%.*}"
          LABEL="${LABEL%%+*}"
          LABEL="$(printf '%s' "$LABEL" | tr '[:upper:]' '[:lower:]')"

          case "$LABEL" in
            "")                      CHANNEL=stable;  CHANNELS="stable beta"; PRERELEASE=false ;;
            nightly*|alpha*|dev*)    CHANNEL=nightly; CHANNELS="nightly";     PRERELEASE=true  ;;
            *)                       CHANNEL=beta;    CHANNELS="beta";        PRERELEASE=true  ;;
          esac

          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "channels=$CHANNELS" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "$TAG is a $CHANNEL release, published to: $CHANNELS"

  build:
    needs: meta
    # Windows only. The shipped shell is a PhotinoX window over a local ASP.NET Core host,
    # and only its Windows path has been built and tested; publishing Linux and macOS
    # packages nobody has run would put broken downloads on the release page.
    # The matrix stays so the artifact names and the update feed keep their RID segment.
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            mainexe: Mnemo.Host.exe
            packIcon: Mnemo.UI/Assets/AppIcons/AppIconDawn.ico
    runs-on: ${{ matrix.os }}
    env:
      PACK_ID: Mnemo.Desktop.V2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mnemo-web/package-lock.json

      - name: Restore vpk tool
        run: dotnet tool restore

      - name: Install web dependencies
        working-directory: mnemo-web
        run: npm ci

      # Everything below this line up to the publish is the gate. It runs before anything
      # is packed, so a tag on a commit that does not pass cannot reach the release page.
      - name: Lint the web UI
        working-directory: mnemo-web
        run: npm run lint

      - name: Typecheck the web UI
        working-directory: mnemo-web
        run: npx tsc -b

      - name: Test the web UI
        working-directory: mnemo-web
        run: npm test

      - name: Test the solution
        run: dotnet test MnemoApp.sln -c Release

      # The Typst binary is not committed, and the csproj only copies it when it is already
      # on disk, so without this the released app has no PDF export at all.
      - name: Restore the Typst binary
        shell: pwsh
        run: ./scripts/restore-typst.ps1 -Rid ${{ matrix.rid }}

      # The published host serves this from wwwroot, so it has to exist before the publish
      # that copies it in. No dist means an app that starts and shows nothing.
      - name: Build the web UI
        working-directory: mnemo-web
        run: npm run build

      - name: Publish
        run: >
          dotnet publish Mnemo.Host/Mnemo.Host.csproj -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ needs.meta.outputs.semver }}
          -p:VersionPrefix=${{ needs.meta.outputs.prefix }}
          -o publish

      # A publish that quietly shipped no UI is worse than a failed build, and the csproj
      # only warns so that ordinary builds and tests never need a web build.
      - name: Verify the SPA was published
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/wwwroot/index.html")) {
            throw "publish/wwwroot/index.html is missing; the SPA did not reach the published output."
          }

      # Pack builds a delta against whatever it finds beside it, and writes a feed listing
      # everything in the directory. Pages replaces the whole site on deploy, so a release
      # that packed against an empty directory would publish a feed with only itself in it
      # and drop every earlier build. Pulling the live feed in first is what keeps the
      # published history whole.
      - name: Fetch the published feeds
        shell: bash
        env:
          CHANNELS: ${{ needs.meta.outputs.channels }}
          FEED_ROOT: https://onemnemo.github.io/mnemo/updates/${{ matrix.rid }}/
        run: |
          set -euo pipefail
          mkdir -p vpk-out
          for ch in $CHANNELS; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "${FEED_ROOT}releases.$ch.json")"
            case "$code" in
              200) dotnet vpk download http --url "$FEED_ROOT" --channel "$ch" -o vpk-out ;;
              404) echo "note: nothing published to $ch yet, packing from empty" ;;
              # Anything else is the feed being unreachable rather than absent, and
              # packing over it would quietly unpublish every earlier build.
              *)   echo "::error::${FEED_ROOT}releases.$ch.json answered $code"; exit 1 ;;
            esac
          done

      # One pack per channel, all into the same directory: Velopack puts the channel in
      # every file name it writes, so the tracks sit side by side without colliding.
      - name: Pack (Velopack)
        shell: bash
        env:
          CHANNELS: ${{ needs.meta.outputs.channels }}
          SEMVER: ${{ needs.meta.outputs.semver }}
        run: |
          set -euo pipefail
          for ch in $CHANNELS; do
            dotnet vpk pack \
              --packId "$PACK_ID" \
              --packTitle Mnemo \
              --packAuthors Mnemo \
              --packVersion "$SEMVER" \
              --runtime ${{ matrix.rid }} \
              --packDir publish \
              --mainExe ${{ matrix.mainexe }} \
              --icon ${{ matrix.packIcon }} \
              -o vpk-out \
              --channel "$ch"
          done

      # Velopack names the installer after the channel rather than the RID, so it is
      # suffixed here for the release page. Only the tag's own channel ships an installer:
      # the extra channels exist to put this build in another feed, and their installer is
      # the same bytes under a name that would only confuse whoever is downloading it.
      - name: Name the installer for the release page
        shell: bash
        env:
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          set -euo pipefail
          cd vpk-out
          mv "$PACK_ID-$CHANNEL-Setup.exe" "$PACK_ID-$CHANNEL-${{ matrix.rid }}-Setup.exe"
          shopt -s nullglob
          for extra in *-Setup.exe; do
            case "$extra" in
              *"-${{ matrix.rid }}-Setup.exe") ;;
              *) rm "$extra" ;;
            esac
          done

      - name: Portable zip (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path "publish/*" -DestinationPath "vpk-out/Mnemo-Portable-${{ matrix.rid }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: vpk-${{ matrix.rid }}
          path: vpk-out/**

  upload-to-release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vpk-*
          merge-multiple: false

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          files: |
            artifacts/**/Mnemo-Portable-*.zip
            artifacts/**/*Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-update-feed-artifact:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vpk-*
          merge-multiple: false

      - name: Upload update feed files
        uses: actions/upload-artifact@v4
        with:
          name: update-feed-${{ needs.meta.outputs.channel }}-${{ github.ref_name }}
          path: |
            artifacts/**/*.nupkg
            artifacts/**/RELEASES-*
            artifacts/**/releases.*.json
            artifacts/**/assets.*.json
          if-no-files-found: error

  publish-update-feed-pages:
    needs: [meta, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vpk-*
          merge-multiple: false

      # One feed root per RID, with every channel inside it. The app asks the same root
      # for releases.{channel}.json, which is how someone switches track without
      # reinstalling.
      #
      # This is the whole site: deploy-pages replaces what is published rather than
      # merging into it. The six 0.6.x paths under updates/stable are therefore retired
      # by their absence here, on purpose. They served a different Velopack app id, so no
      # 0.6.x install could ever have reached 0.8.0 through them, 0.6.5 was the last
      # release they had left to hand out, and carrying them cost roughly 750 MB of the
      # 1 GB this site is allowed. Anyone still on 0.6.x installs 0.8.0 by hand.
      - name: Build update feed site payload
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64; do
            src="artifacts/vpk-$rid"
            if [ ! -d "$src" ]; then
              echo "warning: missing artifact dir $src" >&2
              continue
            fi
            mkdir -p "feed/updates/$rid"
            find "$src" -maxdepth 1 -type f \( -name '*.nupkg' -o -name 'RELEASES-*' -o -name 'releases.*.json' -o -name 'assets.*.json' \) -exec cp -t "feed/updates/$rid/" {} +
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: feed

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
