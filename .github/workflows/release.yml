# Builds the Velopack installer.
# GitHub Release assets remain user-facing only (installer/portable binaries).
# Update-feed files are published as a separate workflow artifact.
name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    # Windows only. The shipped shell is a PhotinoX window over a local ASP.NET Core host,
    # and only its Windows path has been built and tested; publishing Linux and macOS
    # packages nobody has run would put broken downloads on the release page.
    # The matrix stays so the artifact names and the update feed keep their RID segment.
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            mainexe: Mnemo.Host.exe
            packIcon: Mnemo.UI/Assets/AppIcons/AppIconDawn.ico
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mnemo-web/package-lock.json

      - name: Restore vpk tool
        run: dotnet tool restore

      # Tags are v1.2.3; NuGet / MSBuild Version must be semver without the leading v.
      # AssemblyVersion and FileVersion cannot carry a prerelease suffix, so the numeric
      # part is resolved separately and passed as VersionPrefix.
      - name: Resolve semver from tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SEMVER="${TAG#v}"
          PREFIX="${SEMVER%%-*}"
          PREFIX="${PREFIX%%+*}"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      # The Typst binary is not committed, and the csproj only copies it when it is already
      # on disk, so without this the released app has no PDF export at all.
      - name: Restore the Typst binary
        shell: pwsh
        run: ./scripts/restore-typst.ps1 -Rid ${{ matrix.rid }}

      # The published host serves this from wwwroot, so it has to exist before the publish
      # that copies it in. No dist means an app that starts and shows nothing.
      - name: Build the web UI
        working-directory: mnemo-web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Publish
        run: >
          dotnet publish Mnemo.Host/Mnemo.Host.csproj -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ steps.version.outputs.semver }}
          -p:VersionPrefix=${{ steps.version.outputs.prefix }}
          -o publish

      # A publish that quietly shipped no UI is worse than a failed build, and the csproj
      # only warns so that ordinary builds and tests never need a web build.
      - name: Verify the SPA was published
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/wwwroot/index.html")) {
            throw "publish/wwwroot/index.html is missing; the SPA did not reach the published output."
          }

      - name: Pack (Velopack)
        run: >
          dotnet vpk pack
          --packId Mnemo.Desktop
          --packTitle Mnemo
          --packAuthors Mnemo
          --packVersion ${{ steps.version.outputs.semver }}
          --runtime ${{ matrix.rid }}
          --packDir publish
          --mainExe ${{ matrix.mainexe }}
          --icon ${{ matrix.packIcon }}
          -o vpk-out
          --channel stable

      # Velopack uses the same installer filename for every RID; suffix with RID so the
      # GitHub Release still names what a download is for once more RIDs come back.
      - name: Rename release assets per RID
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ matrix.rid }}"
          shopt -s nullglob
          cd vpk-out
          for f in *Setup.exe; do
            mv "$f" "Mnemo.Desktop-stable-${RID}-Setup.exe"
          done

      - name: Portable zip (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path "publish/*" -DestinationPath "vpk-out/Mnemo-Portable-${{ matrix.rid }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: vpk-${{ matrix.rid }}
          path: vpk-out/**

  upload-to-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vpk-*
          merge-multiple: false

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/Mnemo-Portable-*.zip
            artifacts/**/*Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-update-feed-artifact:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vpk-*
          merge-multiple: false

      - name: Upload update feed files
        uses: actions/upload-artifact@v4
        with:
          name: update-feed-stable-${{ github.ref_name }}
          path: |
            artifacts/**/*.nupkg
            artifacts/**/RELEASES-*
            artifacts/**/releases.*.json
            artifacts/**/assets.*.json
          if-no-files-found: error

  publish-update-feed-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vpk-*
          merge-multiple: false

      - name: Build update feed site payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p feed/updates/stable
          for rid in win-x64; do
            src="artifacts/vpk-$rid"
            if [ ! -d "$src" ]; then
              echo "warning: missing artifact dir $src" >&2
              continue
            fi
            mkdir -p "feed/updates/stable/$rid"
            find "$src" -maxdepth 1 -type f \( -name '*.nupkg' -o -name 'RELEASES-*' -o -name 'releases.*.json' -o -name 'assets.*.json' \) -exec cp -t "feed/updates/stable/$rid/" {} +
          done
          # Older app builds use .../updates/stable/ without a RID segment; keep Windows payload there.
          if [ -d feed/updates/stable/win-x64 ]; then
            find feed/updates/stable/win-x64 -maxdepth 1 -type f -exec cp -t feed/updates/stable/ {} +
          fi
          ls -laR feed/updates/stable

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: feed

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
